<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>@BabyAsm</title>
  <meta name="description" content="BabyAsm — Kick yayıncısı">
  <link rel="icon" type="image/png" href="assets/rifle-32.png">
  <!-- ================== AYARLAR ==================
       Aşağıdaki CONFIG içinden isim, bio, linkler,
       avatar ve şarkı adını değiştirebilirsin.
  =============================================== -->
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --kick: #53fc18;
      --card: rgba(20, 20, 20, 0.45);
      --border: rgba(255, 255, 255, 0.12);
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #000;
      color: #fff;
      overflow: hidden;
      cursor: none;
    }
    a, button, input { cursor: none !important; }

    /* ---------- Giriş ekranı ---------- */
    #welcome-screen {
      position: fixed; inset: 0;
      background: #000;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      z-index: 9999;
      transition: opacity .6s ease;
    }
    #welcome-screen.fade { opacity: 0; pointer-events: none; }
    #welcome-screen h1 {
      font-size: 3rem; font-weight: 300;
      letter-spacing: .3em; text-align: center; padding: 0 20px;
      animation: pulse 2s infinite;
    }
    @keyframes pulse { 0%,100% { opacity: .45; } 50% { opacity: 1; } }

    /* ---------- Ana içerik ---------- */
    #main-content { opacity: 0; transition: opacity .9s ease; }
    #main-content.visible { opacity: 1; }

    #bg-video {
      position: fixed; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover; z-index: -1;
    }

    .profile-container {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 40px 20px;
      background: rgba(0, 0, 0, 0.45);
    }

    @property --angle { syntax: '<angle>'; initial-value: 0deg; inherits: false; }

    .card-shell {
      position: relative;
      max-width: 440px; width: 100%;
      border-radius: 26px;
      padding: 1.5px;                       /* kenar kalınlığı */
      background: conic-gradient(from var(--angle),
        transparent 0deg, rgba(83,252,24,.0) 40deg, var(--kick) 90deg,
        rgba(255,255,255,.6) 120deg, transparent 170deg, transparent 360deg);
      animation: spin 6s linear infinite, cardIn .9s cubic-bezier(.2,.8,.2,1) both;
      transition: transform .15s ease-out;
      box-shadow: 0 30px 80px rgba(0,0,0,.6), 0 0 60px rgba(83,252,24,.08);
    }
    @keyframes spin { to { --angle: 360deg; } }
    @keyframes cardIn { from { opacity: 0; translate: 0 30px; scale: .96; } to { opacity: 1; translate: 0 0; scale: 1; } }

    .profile-card {
      position: relative; overflow: hidden;
      background: linear-gradient(160deg, rgba(30,30,30,.72), rgba(8,8,8,.82));
      backdrop-filter: blur(18px) saturate(140%);
      -webkit-backdrop-filter: blur(18px) saturate(140%);
      border-radius: 25px;
      padding: 0 32px 30px;
      text-align: center;
    }
    /* parlama efekti (fareyi takip eder) */
    .profile-card::before {
      content: ''; position: absolute; inset: 0; pointer-events: none;
      background: radial-gradient(400px circle at var(--mx, 50%) var(--my, 0%),
        rgba(255,255,255,.08), transparent 45%);
    }

    .banner {
      height: 96px; margin: 0 -32px;
      background:
        linear-gradient(to bottom, transparent, rgba(8,8,8,.9)),
        radial-gradient(circle at 20% 30%, rgba(83,252,24,.35), transparent 55%),
        radial-gradient(circle at 80% 0%, rgba(255,255,255,.18), transparent 50%);
    }

    .avatar-wrap {
      position: relative; width: 116px; height: 116px;
      margin: -62px auto 14px;
    }
    .avatar-ring {
      position: absolute; inset: -5px; border-radius: 50%;
      background: conic-gradient(from var(--angle), var(--kick), #fff, var(--kick));
      animation: spin 4s linear infinite;
      filter: drop-shadow(0 0 10px rgba(83,252,24,.45));
      opacity: .35; transition: opacity .4s;
    }
    .avatar-wrap.live .avatar-ring { opacity: 1; }
    .avatar, .avatar-fallback {
      position: relative;
      width: 100%; height: 100%;
      border-radius: 50%;
      border: 4px solid #0b0b0b;
      object-fit: cover;
      transition: transform .4s ease;
    }
    .avatar-wrap:hover .avatar { transform: scale(1.05) rotate(-3deg); }
    .avatar-fallback {
      display: none; align-items: center; justify-content: center;
      font-size: 3rem; font-weight: 700;
      background: linear-gradient(135deg, #1b1b1b, #0a0a0a);
    }
    .live-badge {
      position: absolute; bottom: -8px; left: 50%; transform: translateX(-50%);
      background: var(--kick); color: #000;
      font-size: .68rem; font-weight: 800; letter-spacing: .1em;
      padding: 3px 10px 3px 8px; border-radius: 6px;
      display: none; align-items: center; gap: 5px;
      border: 2px solid #0b0b0b;
    }
    .live-badge::before {
      content: ''; width: 6px; height: 6px; border-radius: 50%; background: #000;
      animation: blink 1.2s infinite;
    }
    @keyframes blink { 50% { opacity: .2; } }
    .live-badge.on { display: inline-flex; }

    .username {
      font-size: 2.2rem; font-weight: 700; letter-spacing: -.01em;
      display: inline-flex; align-items: center; gap: 8px;
      background: linear-gradient(90deg, #fff 0%, #fff 40%, var(--kick) 50%, #fff 60%, #fff 100%);
      background-size: 250% 100%;
      -webkit-background-clip: text; background-clip: text; color: transparent;
      animation: shine 5s linear infinite;
    }
    @keyframes shine { from { background-position: 100% 0; } to { background-position: -150% 0; } }
    .verified { width: 22px; height: 22px; flex-shrink: 0; }
    .handle { font-size: .85rem; opacity: .45; margin-top: 2px; letter-spacing: .03em; }
    .bio { font-size: 1rem; opacity: .75; margin: 14px 0 20px; line-height: 1.5; }

    .stream-status {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      font-size: .82rem; opacity: .7; margin-bottom: 18px;
    }
    .stream-status .dot { width: 8px; height: 8px; border-radius: 50%; background: #666; }
    .stream-status.on { opacity: 1; color: var(--kick); }
    .stream-status.on .dot { background: var(--kick); box-shadow: 0 0 10px var(--kick); animation: blink 1.2s infinite; }

    .watch-btn {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      width: 100%; padding: 13px 18px; margin-bottom: 18px;
      background: var(--kick); color: #000;
      font-weight: 800; font-size: .95rem; letter-spacing: .02em;
      border-radius: 14px; text-decoration: none;
      transition: transform .25s ease, box-shadow .25s ease;
      box-shadow: 0 8px 24px rgba(83,252,24,.25);
    }
    .watch-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(83,252,24,.45); }
    .watch-btn svg { width: 18px; height: 18px; }

    .social-links { display: flex; justify-content: center; gap: 12px; }
    .social-links a, .social-links button {
      color: #fff; width: 46px; height: 46px;
      display: flex; align-items: center; justify-content: center;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 14px;
      transition: transform .25s ease, background .25s ease, border-color .25s ease, color .25s ease;
    }
    .social-links a:hover, .social-links button:hover {
      transform: translateY(-3px);
      background: rgba(255,255,255,.12);
      border-color: rgba(255,255,255,.25);
    }
    .social-links .kick:hover { color: var(--kick); border-color: var(--kick); }
    .social-links .discord:hover { color: #8b93ff; border-color: #5865f2; }
    .social-links .insta:hover { color: #ff5fa2; border-color: #e1306c; }
    .social-links svg { width: 22px; height: 22px; }

    /* ---------- Müzik çalar ---------- */
    .music-player {
      position: fixed; top: 20px; left: 20px;
      background: rgba(27, 27, 27, 0.6);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      padding: 12px 40px 12px 20px;
      border-radius: 50px;
      display: flex; align-items: center; gap: 15px;
      z-index: 100;
      border: 1px solid var(--border);
      animation: slideIn .5s ease;
    }
    @keyframes slideIn { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: none; } }

    .album-art {
      width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0;
      background: linear-gradient(135deg, #3a3a3a, #1a1a1a);
      display: flex; align-items: center; justify-content: center;
      animation: rotate 10s linear infinite paused;
    }
    .music-player.playing .album-art { animation-play-state: running; }
    @keyframes rotate { to { transform: rotate(360deg); } }
    .album-art svg { width: 20px; height: 20px; fill: #fff; }

    .track-details { display: flex; flex-direction: column; gap: 2px; }
    .track-title {
      font-size: .85rem; font-weight: 600;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 140px;
    }
    .track-status { font-size: .7rem; color: rgba(255,255,255,.55); display: flex; align-items: center; gap: 5px; }
    .equalizer { display: flex; align-items: flex-end; gap: 2px; height: 12px; }
    .equalizer span {
      width: 3px; height: 30%; background: rgba(255,255,255,.8); border-radius: 2px;
    }
    .music-player.playing .equalizer span { animation: eq .5s ease infinite alternate; }
    .equalizer span:nth-child(2) { animation-delay: .1s; }
    .equalizer span:nth-child(3) { animation-delay: .2s; }
    @keyframes eq { from { height: 20%; } to { height: 100%; } }

    .music-player button {
      background: none; border: none; color: #fff;
      padding: 8px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      transition: background .3s ease, transform .3s ease;
    }
    .music-player button:hover { background: rgba(255,255,255,.1); transform: scale(1.1); }

    .controls, .volume-container { display: none; align-items: center; gap: 8px; }
    .music-player.expanded .controls,
    .music-player.expanded .volume-container { display: flex; }

    .toggle-btn { position: absolute; top: 50%; right: 8px; transform: translateY(-50%); padding: 5px !important; }
    .toggle-btn:hover { transform: translateY(-50%) scale(1.1) !important; }

    .volume-slider {
      width: 80px; -webkit-appearance: none; appearance: none;
      height: 4px; background: rgba(255,255,255,.2); border-radius: 2px; outline: none;
    }
    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none; width: 12px; height: 12px;
      background: #fff; border-radius: 50%; box-shadow: 0 0 10px rgba(255,255,255,.5);
    }
    .volume-slider::-moz-range-thumb {
      width: 12px; height: 12px; border: none;
      background: #fff; border-radius: 50%;
    }

    /* ---------- Toast ---------- */
    .toast {
      position: fixed; bottom: 30px; left: 50%;
      background: rgba(27,27,27,.9); backdrop-filter: blur(10px);
      padding: 12px 20px; border-radius: 25px; font-size: .9rem;
      z-index: 300; opacity: 0;
      transform: translate(-50%, 20px);
      transition: all .3s ease;
      border: 1px solid var(--border);
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    /* ---------- İmleç ---------- */
    .custom-cursor {
      position: fixed; width: 8px; height: 8px;
      background: rgba(255,255,255,.95); border-radius: 50%;
      pointer-events: none; z-index: 99999;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 10px rgba(255,255,255,.8), 0 0 20px rgba(255,255,255,.5), 0 0 30px rgba(255,255,255,.3);
      left: -100px; top: -100px;
      transition: transform .15s ease, background .15s ease;
    }
    .custom-cursor.hover { transform: translate(-50%, -50%) scale(2); }

    /* ---------- Mobil ---------- */
    @media (max-width: 768px), (hover: none) {
      body, a, button, input { cursor: auto !important; }
      .custom-cursor { display: none; }
    }
    @media (max-width: 768px) {
      #welcome-screen h1 { font-size: 1.5rem; letter-spacing: .2em; }
      .profile-card { padding: 0 20px 24px; }
      .banner { margin: 0 -20px; height: 80px; }
      .avatar-wrap { width: 96px; height: 96px; margin-top: -52px; }
      .username { font-size: 1.8rem; }
      .bio { font-size: .95rem; }
      .music-player {
        top: 15px; left: 15px; max-width: calc(100% - 30px);
        padding: 8px 38px 8px 12px; gap: 8px; flex-wrap: wrap;
      }
      .album-art { width: 32px; height: 32px; }
      .track-title { max-width: 100px; font-size: .75rem; }
      .volume-slider { width: 60px; }
    }
  </style>
</head>

        <button id="muteBtn" title="Sessiz">
          <svg id="volumeIcon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
          <svg id="muteIcon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
        </button>
        <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="50">
      </div>
    </div>

    <div class="toast" id="toast">kopyalandı ✓</div>
  </div>

  <script>
    // ================== AYARLAR ==================
    const CONFIG = {
      name:      'BabyAsm',
      bio:       'yayınlarda görüşürüz',      // bio yazısı
      avatar:    'avatar.webp',               // klasöre avatar.webp koy (yoksa "B" harfi görünür)
      kick:      'https://kick.com/babyasm',
      kickSlug:  'babyasm',                   // canlı yayın rozeti için
      discord:   'https://discord.gg/kNKjH43pas',
      instagram: 'https://www.instagram.com/asim.alatas70/',
      trackTitle:'BabyAsm',                   // müzik çalardaki yazı
      titleText: '@BabyAsm'                   // sekme başlığı animasyonu
    };
    // ============================================

    const $ = id => document.getElementById(id);

    // İçeriği doldur
    $('username').textContent = CONFIG.name;
    $('bio').textContent = CONFIG.bio;
    $('trackTitle').textContent = CONFIG.trackTitle;
    $('kickLink').href = CONFIG.kick;
    $('watchBtn').href = CONFIG.kick;
    $('handle').textContent = '@' + CONFIG.kickSlug;
    if (CONFIG.instagram) $('instaLink').href = CONFIG.instagram; else $('instaLink').remove();
    if (CONFIG.discord) $('discordBtn').href = CONFIG.discord; else $('discordBtn').remove();

    const avatar = $('avatar');
    avatar.onerror = () => { avatar.style.display = 'none'; $('avatarFallback').style.display = 'flex'; };
    $('avatarFallback').textContent = CONFIG.name.charAt(0).toUpperCase();
    avatar.src = CONFIG.avatar;

    // Sekme başlığı yazma animasyonu
    (function animateTitle(i = 0) {
      document.title = CONFIG.titleText.substring(0, i + 1) || CONFIG.titleText;
      const next = i >= CONFIG.titleText.length ? 0 : i + 1;
      setTimeout(() => animateTitle(next), i >= CONFIG.titleText.length ? 2000 : 200);
    })();

    // Kick canlı mı? (Kick izin vermezse sessizce geçer)
    fetch('https://kick.com/api/v2/channels/' + CONFIG.kickSlug)
      .then(r => r.ok ? r.json() : null)
      .then(d => {
        if (!d) return;
        if (d.livestream) {
          $('liveBadge').classList.add('on');
          $('avatarWrap').classList.add('live');
          $('watchText').textContent = 'Şimdi izle';
        }
        if (d.user && d.user.profile_pic && !avatar.naturalWidth) {
          avatar.style.display = ''; $('avatarFallback').style.display = 'none';
          avatar.src = d.user.profile_pic;
        }
      })
      .catch(() => {});

    // İmleç
    const cursor = $('cursor');
    document.addEventListener('mousemove', e => {
      cursor.style.left = e.clientX + 'px';
      cursor.style.top = e.clientY + 'px';
    });
    document.querySelectorAll('a, button, input').forEach(el => {
      el.addEventListener('mouseenter', () => cursor.classList.add('hover'));
      el.addEventListener('mouseleave', () => cursor.classList.remove('hover'));
    });

    // Kartın fareye göre hafif eğilmesi
    const card = $('card'), cardInner = $('cardInner');
    document.addEventListener('mousemove', e => {
      const x = (e.clientX / innerWidth - .5) * 8;
      const y = (e.clientY / innerHeight - .5) * -8;
      card.style.transform = `perspective(900px) rotateX(${y}deg) rotateY(${x}deg)`;
      const r = cardInner.getBoundingClientRect();
      cardInner.style.setProperty('--mx', (e.clientX - r.left) + 'px');
      cardInner.style.setProperty('--my', (e.clientY - r.top) + 'px');
    });

    // Tık sesi
    let audioCtx;
    function playClickSound() {
      try {
        audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.connect(g); g.connect(audioCtx.destination);
        o.frequency.setValueAtTime(800, audioCtx.currentTime);
        o.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + .1);
        g.gain.setValueAtTime(.3, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(.01, audioCtx.currentTime + .1);
        o.start(); o.stop(audioCtx.currentTime + .1);
      } catch (_) {}
    }

    // Video / müzik
    const video = $('bg-video');
    const player = $('musicPlayer');
    const slider = $('volumeSlider');
    let prevVolume = 50;

    function syncUI() {
      const playing = !video.paused;
      player.classList.toggle('playing', playing);
      $('statusText').textContent = playing ? 'Playing' : 'Paused';
      $('playIcon').style.display = playing ? 'none' : 'block';
      $('pauseIcon').style.display = playing ? 'block' : 'none';
      const muted = video.muted || video.volume === 0;
      $('volumeIcon').style.display = muted ? 'none' : 'block';
      $('muteIcon').style.display = muted ? 'block' : 'none';
    }
    ['play', 'pause', 'volumechange'].forEach(ev => video.addEventListener(ev, syncUI));

    $('welcome-screen').addEventListener('click', () => {
      playClickSound();
      $('welcome-screen').classList.add('fade');
      $('main-content').classList.add('visible');
      setTimeout(() => $('welcome-screen').remove(), 700);
      video.muted = false;
      video.volume = slider.value / 100;
      video.play().catch(() => { video.muted = true; video.play().catch(() => {}); });
    });

    $('playPauseBtn').addEventListener('click', () => video.paused ? video.play() : video.pause());

    slider.addEventListener('input', e => {
      video.volume = e.target.value / 100;
      video.muted = false;
    });

    $('muteBtn').addEventListener('click', () => {
      if (video.muted || video.volume === 0) {
        video.muted = false;
        video.volume = (prevVolume || 50) / 100;
        slider.value = prevVolume || 50;
      } else {
        prevVolume = slider.value;
        video.muted = true;
        slider.value = 0;
      }
    });

    $('toggleBtn').addEventListener('click', e => {
      e.stopPropagation();
      const open = player.classList.toggle('expanded');
      $('toggleIcon').style.transform = open ? 'rotate(180deg)' : '';
    });
  </script>
</body>
</html>
